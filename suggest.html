<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>확장팩 제안함 · 에듀케이션 카페</title>
<meta name="description" content="필요한 웹앱 아이디어를 제안해 주세요">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
<link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
</head>
<body>
<header id="site-header"></header>
<main>
  <section class="page-title">
    <div class="eyebrow">EXPANSION PACK</div>
    <h1>확장팩 제안함</h1>
    <p>“이런 앱이 있으면 좋겠어요”를 들려주세요. 채택된 제안은 선반의 새 박스가 됩니다.</p>
  </section>

  <div class="suggest-layout">
    <form class="proposal" id="proposal-form" novalidate>
      <div class="field">
        <label for="f-title">제안 제목 <span class="hint">(필수)</span></label>
        <input type="text" id="f-title" name="title" maxlength="60" required placeholder="예: 모둠 자동 편성 도우미">
      </div>
      <div class="field">
        <label for="f-problem">어떤 불편을 해결하고 싶나요? <span class="hint">(필수)</span></label>
        <textarea id="f-problem" name="problem" maxlength="1000" required placeholder="언제, 어떤 점이 불편한지 적어 주세요."></textarea>
      </div>
      <fieldset class="field">
        <legend>누가 쓰면 좋을까요?</legend>
        <div class="choices">
          <label><input type="radio" name="audience" value="학생"> 학생</label>
          <label><input type="radio" name="audience" value="교사"> 교사</label>
          <label><input type="radio" name="audience" value="학부모"> 학부모</label>
          <label><input type="radio" name="audience" value="기타"> 기타</label>
        </div>
      </fieldset>
      <div class="field">
        <label for="f-nickname">닉네임 <span class="hint">(선택 · 실명이나 연락처는 적지 말아 주세요)</span></label>
        <input type="text" id="f-nickname" name="nickname" maxlength="20">
      </div>
      <div class="hp" aria-hidden="true">
        <label for="f-website">이 칸은 비워 두세요</label>
        <input type="text" id="f-website" name="website" tabindex="-1" autocomplete="off">
      </div>
      <button class="btn btn--primary" type="submit" id="submit-btn">제안서 보내기</button>
      <p class="form-status" id="form-status" role="status"></p>
    </form>

    <aside class="side-note">
      <h2>제안서는 이렇게 처리돼요</h2>
      <ol>
        <li>보내 주신 제안은 카페 주인만 볼 수 있어요.</li>
        <li>하나씩 읽고 만들 수 있을지 검토해요.</li>
        <li>채택된 제안은 선반에 ‘개봉 예정’ 박스로 올라가요.</li>
      </ol>
    </aside>
  </div>
</main>
<footer id="site-footer"></footer>
<script src="assets/js/config.js"></script>
<script src="assets/js/common.js"></script>
<script src="assets/js/suggest.js"></script>
</body>
</html>
