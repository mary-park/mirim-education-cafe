<header id="site-header"></header>
<main>
  <section class="lobby-hero">
    <div>
      <div class="eyebrow">WELCOME TO</div>
      <h1>에듀케이션 카페</h1>
      <p>교실과 일상을 위해 만든 웹앱을 보드게임처럼 선반에 진열했어요. 마음에 드는 박스를 꺼내 룰북을 펼쳐 보세요.</p>

    <div>
      <h2>이런 앱이 있으면 좋겠어요!</h2>
      <p>필요한 앱 아이디어를 확장팩 제안서로 보내 주세요. 채택되면 선반에 새 박스가 올라가요.</p>
