<meta property="og:type" content="website">
<meta property="og:site_name" content="에듀케이션 카페">
<meta property="og:title" content="에듀케이션 카페">
<meta property="og:description" content="교실과 일상을 위한 웹앱을 보드게임처럼 하나씩 개봉하는 카페">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">

<link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
</head>
<body>
<header id="site-header"></header>
<main>
  <section class="lobby-hero">
    <div class="hero-text">
      <div class="eyebrow">WELCOME TO</div>
      <h1>햇살 드는 원목 선반에서<br>오늘의 앱을 골라 보세요</h1>
      <p>교실과 일상을 위해 만든 웹앱을 보드게임처럼 진열했어요. 박스를 꺼내면 룰북이 펼쳐져요.</p>
      <div class="hero-actions">
        <a class="btn btn--primary" href="#shelf">선반 둘러보기</a>
        <a class="btn btn--ghost" href="suggest.html">확장팩 제안하기</a>
      </div>
    </div>
  </section>

  <section aria-label="웹앱 선반">
    <div class="shelf-unit" id="shelf"><p class="notice">선반을 준비하고 있어요…</p></div>
  </section>

  <section class="lobby-bottom">
    <div aria-labelledby="news-title">
      <div class="news-head">
        <h2 id="news-title">최근 소식</h2>
        <a href="log.html">플레이 로그 전체 보기 →</a>
      </div>
      <ol class="log-list log-list--compact" id="news"></ol>
    </div>
    <aside class="chalkboard" aria-labelledby="menu-title">
      <h2 id="menu-title">오늘의 메뉴판</h2>
      <div id="menu" aria-live="polite"><div class="chalk-row"><span>메뉴를 적는 중…</span></div></div>
    </aside>
  </section>
</main>
<footer id="site-footer"></footer>
<script src="assets/js/config.js"></script>
<script src="assets/js/common.js"></script>
<script src="assets/js/lobby.js"></script>
</body>
